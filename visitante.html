        if (file_exists($filename)) {
            $lines = file($filename, FILE_IGNORE_NEW_LINES);
            if (!empty($lines)) {
                echo "<pre>";
                foreach ($lines as $line) {
                    echo htmlspecialchars($line) . "<br>";
                }
                echo "</pre>";
            } else {
                echo "<p>No hay visitantes registrados.</p>";
            }
        } else {
