<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantel Valle de Bravo</title>
    <link rel="stylesheet" href="principal.css">
    <link rel="icon" href="img/unnamed-removebg-preview.png" type="png">
    <style>
        /* General Styles */
        body {
            margin: 0;
            font-family: sans-serif; /* Choose a suitable font */
        }

        /* Header and Wave Styles */
        .header {
            position: relative;
            width: 100%;
            overflow: hidden;
            background: linear-gradient(to top, #0593bb 20%, #0e26ae 80%);
        }

        .inner-header {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 20vh; /* Adjust as needed */
        }

        .logo {
            /* Style your logo here */
            color: white;
            font-size: 1.5em;
        }

        .agua {
            display: block;
            width: 100%;
            height: 100px; /* Adjust wave height */
        }

        .parallax > use {
            animation: move-forever 12s cubic-bezier(0.55, 0.5, 0.45, 0.5) infinite;
        }

        .parallax > use:nth-child(1) {
            animation-delay: -2s;
            animation-duration: 7s;
        }

        .parallax > use:nth-child(2) {
            animation-delay: -3s;
            animation-duration: 10s;
        }

        .parallax > use:nth-child(3) {
            animation-delay: -4s;
            animation-duration: 13s;
        }

        .parallax > use:nth-child(4) {
            animation-delay: -5s;
            animation-duration: 20s;
        }

        @keyframes move-forever {
            0% {
                transform: translate(-90px, 0%);
            }
            100% {
                transform: translate(85px, 0%);
            }
        }

        /* Gallery Styles */
        #gallery1 {
            padding: 20px;
        }

        #gallery1 h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .content-all {
            overflow: hidden;
            width: 100%;
        }

        .content-carrousel {
            display: flex;
            width: auto; /* Adjust based on number of images */
            animation: slideshow 20s linear infinite; /* Adjust speed */
        }

        .content-carrousel:hover {
            animation-play-state: paused;
        }

        .content-carrousel figure {
            width: 300px; /* Adjust image width */
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .content-carrousel figure img {
            width: 100%;
            height: auto;
            object-fit: cover;
        }

        @keyframes slideshow {
            0% {
                transform: translateX(0%);
            }
            100% {
                transform: translateX(-100%); /* Move all images out of view */
            }
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .inner-header {
                height: 15vh;
            }

            #gallery1 figure {
                width: 200px; /* Smaller images on smaller screens */
            }
        }

        @media (max-width: 480px) {
            .inner-header {
                height: 10vh;
            }

            #gallery1 figure {
                width: 150px; /* Even smaller images on phones */
            }
        }

        /* Wave styles (adjust for mobile) */
        .waveWrapper {
            position: relative;
            width: 100%;
            height: 100px; /* Reduced height for mobile */
            overflow: hidden;
        }

        .waveWrapperInner {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .wave {
            position: absolute;
            width: 200%;
            height: 100%;
            background-repeat: repeat no-repeat;
            background-position: 0 bottom;
            transform-origin: center bottom;
        }

        /* Adjust wave animations */
        .waveTop {
            background-size: 50% 50px; /* Smaller wave */
        }

        .waveMiddle {
            background-size: 50% 60px; /* Smaller wave */
        }

        .waveBottom {
            background-size: 50% 50px; /* Smaller wave */
        }

        /* Separator */
        .separador {
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="inner-header flex">
            <div class="logo">
                <!-- Your Logo Content -->
                Plantel Valle de Bravo
            </div>
        </div>
        <div>
            <svg class="agua" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
                 viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
                <defs>
                    <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z"/>
                </defs>
                <g class="parallax">
                    <use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(255,255,255,0.7"/>
                    <use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(255,255,255,0.5"/>
                    <use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(255,255,255,0.3"/>
                    <use xlink:href="#gentle-wave" x="48" y="7" fill="#fff"/>
                </g>
            </svg>
        </div>
    </div>

    <div id="gallery1">
        <section>
            <h2>CREA EXPERIENCIAS</h2>
            <div class="content-all">
                <div class="content-carrousel">
                    <figure><img src="ejemploprocedimiento.jpg" alt="Image 1"></figure>
                    <figure><img src="Pasaporte.png" alt="Image 2"></figure>
                    <figure><img src="tramites.jpg" alt="Image 3"></figure>
                    <figure><img src="DOCUMENTACION.jpg" alt="Image 4"></figure>
                    <figure><img src="DOCUMENTO.jpg" alt="Image 5"></figure>
                    <figure><img src="tramites.jpg" alt="Image 6"></figure>
                    <figure><img src="identificacion-mexico.webp" alt="Image 7"></figure>
                    <figure><img src="Pasaporte.png" alt="Image 8"></figure>
                    <figure><img src="ejemploprocedimiento.jpg" alt="Image 9"></figure>
                </div>
            </div>
        </section>
    </div>

    <div class="separador"></div>
</body>
</html>
