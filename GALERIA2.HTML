<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Trámites</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }

        h2 {
            text-align: center;
            padding: 20px 0;
            background-color: #333;
            color: white;
            margin: 0;
        }

        .galeria-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            grid-gap: 15px;
            padding: 20px;
            justify-content: center;
        }

        .galeria-item {
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .galeria-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.3s ease;
        }

        .galeria-item:hover img {
            transform: scale(1.1);
        }

        /* Estilo para simular el hexágono */
        .galeria-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.1); /* Ajusta la transparencia para el efecto deseado */
            clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
            pointer-events: none; /* Permite interactuar con la imagen */
        }
    </style>
</head>
<body>
    <h2>Trámites Ciudadanos Administrativos Básicos</h2>
    <section class="galeria-container">
        <div class="galeria-item">
            <img src="solicitudecurp.png" alt="Solicitud CURP">
        </div>
        <div class="galeria-item">
            <img src="CURP1.png" alt="CURP">
        </div>
        <div class="galeria-item">
            <img src="expedicion.png" alt="Expedición">
        </div>
        <div class="galeria-item">
            <img src="tramitedepasaporte.png" alt="Trámite de Pasaporte">
        </div>
        <div class="galeria-item">
            <img src="registro.png" alt="Registro">
        </div>
        <div class="galeria-item">
            <img src="licencia.png" alt="Licencia">
        </div>
        <div class="galeria-item">
            <img src="inscribe.png" alt="Inscribe">
        </div>
        <div class="galeria-item">
            <img src="tramiterfc.png" alt="Trámite RFC">
        </div>
        <div class="galeria-item">
            <img src="constancias.png" alt="Constancias">
        </div>
        <div class="galeria-item">
            <img src="solicitudactadenacimiento.png" alt="Solicitud Acta de Nacimiento">
        </div>
        <div class="galeria-item">
            <img src="CURP1.png" alt="CURP">
        </div>
        <div class="galeria-item">
            <img src="inscribe.png" alt="Inscribe">
        </div>
    </section>
</body>
</html>
