<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plantel Valle de Bravo</title>
<link rel="stylesheet" href="principal.css">
<link rel="icon" href="valle.png" type="png">

<style>
/* Estilos generales */
body {
    font-family: Arial, sans-serif;
    background-color: #333; /* Fondo gris oscuro */
    color: white;
    margin: 0;
    padding: 0;
}

/* Estilos del encabezado (sin cambios significativos) */
.header, .inner-header, .agua {
    /* Mantén tus estilos actuales para el encabezado y la ola */
}

/* Estilo del título */
h2 {
    text-align: center;
    font-size: 2em; /* Ajusta el tamaño según sea necesario */
    color: #98ff98; /* Verde azulado claro */
    text-shadow: 2px 2px 4px #000000; /* Sombra para resaltar */
    margin: 20px 0;
}

/* Estilos para el diseño de panal */
.content-all {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    max-width: 900px;
    margin: 20px auto;
    padding: 20px;
}

.content-carrousel {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
}

.content-carrousel figure {
    width: 200px; /* Ajusta el tamaño del hexágono */
    height: 200px;
    margin: 10px;
    overflow: hidden;
    border-radius: 50%; /* Hace la imagen circular */
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); /* Forma de hexágono */
}

.content-carrousel figure img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* Para que la imagen cubra todo el hexágono */
    transition: transform 0.3s ease;
}

.content-carrousel figure:hover img {
    transform: scale(1.1); /* Efecto de zoom al pasar el ratón */
}

/* Estilos responsivos (ajusta según sea necesario) */
@media (max-width: 768px) {
    .content-carrousel figure {
        width: 150px;
        height: 150px;
    }
}
</style>
</head>
<body>

<div class="header">
    <div class="inner-header flex">
        <div class="logo"></div>
    </div>
    <div>
        <svg class="agua" ...>
        </svg>
    </div>
</div>

<div id="gallery1" class="gallery2">
    <section>
        <h2>TRÁMITES CIUDADANOS ADMINISTRATIVOS BÁSICOS</h2>
        <div class="content-all">
            <div class="content-carrousel">
                <figure><img src="ejemploprocedimiento.jpg" alt="Trámite 1"></figure>
                <figure><img src="Pasaporte.png" alt="Trámite 2"></figure>
                <figure><img src="tramites.jpg" alt="Trámite 3"></figure>
                <figure><img src="DOCUMENTACION.jpg" alt="Trámite 4"></figure>
                <figure><img src="DOCUMENTO.jpg" alt="Trámite 5"></figure>
                <figure><img src="tramites.jpg" alt="Trámite 6"></figure>
                <figure><img src="identificacion-mexico.webp" alt="Trámite 7"></figure>
                <figure><img src="Pasaporte.png" alt="Trámite 8"></figure>
                <figure><img src="ejemploprocedimiento.jpg" alt="Trámite 9"></figure>
            </div>
        </div>
    </section>
</div>

<div class="separador"></div>

</body>
</html>
